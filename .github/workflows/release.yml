# Build and publish a release when a version tag (vX.Y.Z) is pushed:
# archives for Linux and macOS, deb and rpm packages, checksums.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Release notes are this version's section of CHANGELOG.md; a
      # pre-release (vX.Y.Z-rc.1) may use [Unreleased] instead.
      - name: Release notes
        run: |
          notes() {
            awk -v v="$1" '
              index($0, "## [" v "]") == 1 { f = 1; next }
              /^## \[/ { f = 0 }
              /^\[[^]]+\]: / { next }
              f' CHANGELOG.md
          }
          notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          case "$GITHUB_REF_NAME" in
            *-*) test -s "$RUNNER_TEMP/notes.md" || notes Unreleased > "$RUNNER_TEMP/notes.md" ;;
          esac
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG section for $GITHUB_REF_NAME"; exit 1; }
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
